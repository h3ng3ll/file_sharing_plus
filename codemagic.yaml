workflows:
  upload_macos_metadata:
    name: Upload macOS metadata
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: 16.2
      groups:
        - store_credentials
      vars:
        # The Mac app is a separate App Store record from the iOS one.
        MACOS_BUNDLE_ID: com.hengell.file-sharing-plus
        APP_NAME: $APPSTORE_APP_NAME
    scripts:
      - name: Print working dir & contents
        script: |
          echo "PWD: $(pwd)"
          ls -R
      - name: Install Ruby dependencies
        script: |
          bundle install || bundle install --path vendor/bundle
          gem install fastlane-plugin-appicon || true
      - name: Validate macOS metadata directory structure
        script: |
          echo "===== Validating macOS Metadata ====="
          if [ ! -d "./fastlane/metadata_macos" ]; then
            echo "ERROR: Metadata directory not found at ./fastlane/metadata_macos"
            exit 1
          fi
          if [ ! -d "./fastlane/metadata_macos/en-US" ]; then
            echo "ERROR: No en-US metadata folder found in ./fastlane/metadata_macos"
            exit 1
          fi
          REQUIRED_FILES=("name.txt" "description.txt" "keywords.txt" "privacy_url.txt" "support_url.txt")
          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "./fastlane/metadata_macos/en-US/$FILE" ]; then
              echo "ERROR: Required metadata file ./fastlane/metadata_macos/en-US/$FILE is missing"
              exit 1
            fi
          done
          echo "macOS metadata validation successful!"
      - name: Validate macOS screenshot dimensions
        script: |
          # App Store Connect accepts only these four sizes for a Mac
          # screenshot. Failing here beats an IMAGE_INCORRECT_DIMENSIONS
          # rejection after the upload has already run.
          echo "===== Validating macOS Screenshots ====="
          DIR="./fastlane/screenshots_macos/en-US"
          if [ ! -d "$DIR" ]; then
            echo "ERROR: $DIR not found"
            exit 1
          fi
          COUNT=0
          for F in "$DIR"/*.png; do
            [ -f "$F" ] || continue
            W=$(sips -g pixelWidth "$F" | awk '/pixelWidth/{print $2}')
            H=$(sips -g pixelHeight "$F" | awk '/pixelHeight/{print $2}')
            case "${W}x${H}" in
              1280x800|1440x900|2560x1600|2880x1800)
                echo "  OK   $(basename "$F") ${W}x${H}" ;;
              *)
                echo "  FAIL $(basename "$F") ${W}x${H} — must be 1280x800, 1440x900, 2560x1600 or 2880x1800"
                exit 1 ;;
            esac
            COUNT=$((COUNT+1))
          done
          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: no PNG screenshots found in $DIR"
            exit 1
          fi
          echo "All $COUNT macOS screenshots have valid dimensions"
      - name: Upload macOS metadata via fastlane deliver
        script: |
          bundle exec fastlane mac upload_metadata_macos
    artifacts:
      - fastlane/logs/**/*

  upload_ios_metadata:
    name: Upload iOS metadata
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: 16.2
      groups:
        - store_credentials
      vars:
        IOS_BUNDLE_ID: com.hengell.file-sharing-plus
        APP_NAME: $APPSTORE_APP_NAME
    scripts:
      - name: Print working dir & contents
        script: |
          echo "PWD: $(pwd)"
          ls -R
      - name: Install Ruby dependencies
        script: |
          bundle install || bundle install --path vendor/bundle
          gem install fastlane-plugin-appicon || true
      - name: Validate metadata directory structure
        script: |
          echo "===== Validating Metadata ====="
          if [ ! -d "./fastlane/metadata" ]; then
            echo "ERROR: Metadata directory not found at ./fastlane/metadata"
            exit 1
          fi
          if [ ! -d "./fastlane/metadata/en-US" ]; then
            echo "ERROR: No en-US metadata folder found in ./fastlane/metadata"
            exit 1
          fi
          echo "Scanning metadata locales..."
          find ./fastlane/metadata -maxdepth 1 -type d | grep -v "^./fastlane/metadata$" | grep -v "review_information" | sort | while read LOCALE_DIR; do
            LOCALE=$(basename "$LOCALE_DIR")
            echo "Processing metadata locale: $LOCALE"
            REQUIRED_FILES=("name.txt" "description.txt" "keywords.txt")
            MISSING=0
            for FILE in "${REQUIRED_FILES[@]}"; do
              if [ ! -f "$LOCALE_DIR/$FILE" ]; then
                echo "  - WARNING: $FILE is missing in $LOCALE"
                MISSING=$((MISSING+1))
              fi
            done
            if [ $MISSING -eq 0 ]; then
              echo "  - All required files present in $LOCALE"
            else
              echo "  - $MISSING required files missing in $LOCALE"
            fi
          done
          REQUIRED_FILES=("name.txt" "description.txt" "keywords.txt" "privacy_url.txt" "support_url.txt")
          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "./fastlane/metadata/en-US/$FILE" ]; then
              echo "ERROR: Required metadata file ./fastlane/metadata/en-US/$FILE is missing"
              exit 1
            fi
          done
          LANGUAGE_FOLDERS=$(find ./fastlane/metadata -maxdepth 1 -type d | grep -v "^./fastlane/metadata$" | grep -v "review_information" | wc -l)
          echo "Found $LANGUAGE_FOLDERS language folders in metadata"
          if [ -d "./fastlane/metadata/review_information" ]; then
            echo "Review information folder found"
            REVIEW_FILES=$(find "./fastlane/metadata/review_information" -type f | wc -l)
            echo "Found $REVIEW_FILES files in review_information"
          else
            echo "WARNING: No review_information folder found - this might be needed for new app submissions"
          fi
          echo "Metadata validation successful!"
      - name: Upload metadata via fastlane deliver
        script: |
          bundle exec fastlane ios upload_metadata
    artifacts:
      - fastlane/logs/**/*

  ios-workflow:
    name: iOS Workflow
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: file_sharing_plus
    environment:
      groups:
        - store_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: $IOS_BUNDLE_ID
      vars:
        BUNDLE_ID: "$IOS_BUNDLE_ID"
        APP_STORE_APPLE_ID: $APPSTORE_APP_ID
      flutter: 3.44.4
      xcode: latest
      cocoapods: default
    scripts:
      - name: Detach Xcode project from any developer account
        script: |
          # Remove account-specific signing keys so Codemagic resolves the
          # team itself via the App Store Connect API key + Apple Developer
          # account (use-profiles below). Done on CI only — local dev keeps
          # its own signing. macOS BSD sed.
          PBXPROJ="ios/Runner.xcodeproj/project.pbxproj"
          for KEY in DEVELOPMENT_TEAM CODE_SIGN_IDENTITY PROVISIONING_PROFILE PROVISIONING_PROFILE_SPECIFIER; do
            COUNT=$(grep -Ec "^[[:space:]]*$KEY = [^;]*;" "$PBXPROJ" 2>/dev/null || true)
            sed -i '' -E "/^[[:space:]]*$KEY = [^;]*;[[:space:]]*$/d" "$PBXPROJ"
            echo "  Removed $KEY (${COUNT:-0} occurrence(s))"
          done
          sed -i '' -E 's/CODE_SIGN_STYLE = [^;]*;/CODE_SIGN_STYLE = Automatic;/g' "$PBXPROJ"
          echo "  Forced CODE_SIGN_STYLE = Automatic"
      - name: Set up provisioning profiles settings on Xcode project
        script: xcode-project use-profiles --verbose
      - name: Clean Flutter project
        script: |
          flutter clean
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Install pods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Flutter build ipa
        script: |
          flutter build ipa --release \
            --build-name=1.0 \
            --build-number=1 \
            --export-options-plist=ios/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        api_key: $APPSTORE_P8
        key_id: $APPSTORE_KEY_ID
        issuer_id: $APPSTORE_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
  macos-workflow:
    name: macOS Workflow
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      groups:
        - store_credentials

      vars:
        BUNDLE_ID: "$MACOS_BUNDLE_ID"
        APP_STORE_APPLE_ID: "$APPSTORE_APP_ID"

      flutter: 3.44.4
      xcode: latest
      cocoapods: default

    scripts:

      - name: Initialize keychain
        script: |
          set -e
          keychain initialize

      - name: Import signing certificates
        script: |
          set -e

          echo "$MAC_APP_DISTRIBUTION_P12" | base64 --decode > /tmp/mac_app_distribution.p12
          echo "$MAC_INSTALLER_DISTRIBUTION_P12" | base64 --decode > /tmp/mac_installer_distribution.p12

          keychain add-certificates \
            /tmp/mac_app_distribution.p12 \
            /tmp/mac_installer_distribution.p12

      - name: Verify signing identities
        script: |
          set -e

          echo "=== SIGNING IDENTITIES ==="
          security find-identity -v

          echo "=== MAC APP DISTRIBUTION ==="
          security find-identity -v | grep -E \
            "Mac Developer|3rd Party Mac Developer Application|Mac App Distribution"

          echo "=== MAC INSTALLER DISTRIBUTION ==="
          security find-identity -v | grep -E \
            "3rd Party Mac Developer Installer|Mac Installer Distribution"

      - name: Set up provisioning profiles
        script: |
          set -e
          xcode-project use-profiles --verbose

      - name: Configure macOS signing
        script: |
          set -e

          PBXPROJ="macos/Runner.xcodeproj/project.pbxproj"

          sed -i '' -E \
            's/CODE_SIGN_STYLE = [^;]+;/CODE_SIGN_STYLE = Manual;/g' \
            "$PBXPROJ"

          sed -i '' -E \
            's/DEVELOPMENT_TEAM = [^;]+;/DEVELOPMENT_TEAM = '"$TEAM_ID"';/g' \
            "$PBXPROJ"

          echo "=== SIGNING CONFIG ==="
          grep -nE \
            "CODE_SIGN|DEVELOPMENT_TEAM|PROVISIONING_PROFILE" \
            "$PBXPROJ" || true

      - name: Clean Flutter project
        script: |
          flutter clean

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Install pods
        script: |
          find . -name "Podfile" -execdir pod install \;

      - name: Build macOS
        script: |
          set -e
          flutter build macos --release

      - name: Verify macOS app signing
        script: |
          set -e

          APP="build/macos/Build/Products/Release/File Sharing Plus.app"

          echo "=== PROVISIONING PROFILE ==="
          ls -la "$APP/Contents/embedded.provisionprofile" || true

          echo "=== CODE SIGNATURE ==="
          codesign -dv --verbose=4 "$APP"

          echo "=== ENTITLEMENTS ==="
          codesign -d --entitlements :- "$APP" || true

          echo "=== VERIFY SIGNATURE ==="
          codesign --verify --deep --strict --verbose=4 "$APP"

      - name: Create signed PKG
        script: |
          set -e

          APP="build/macos/Build/Products/Release/File Sharing Plus.app"
          PKG="build/macos/pkg/File-Sharing-Plus.pkg"

          mkdir -p build/macos/pkg

          productbuild \
            --component "$APP" \
            /Applications \
            --sign "$MAC_INSTALLER_SIGNING_IDENTITY" \
            "$PKG"

      - name: Verify PKG signature
        script: |
          set -e

          pkgutil --check-signature \
            "build/macos/pkg/File-Sharing-Plus.pkg"

      - name: Publish to App Store
        script: |
          set -e

          xcrun altool \
            --upload-app \
            -f "build/macos/pkg/File-Sharing-Plus.pkg" \
            -t macos \
            -u "$APPLE_ID" \
            --app-password "$APP_PASSWORD"

    artifacts:
      - build/macos/pkg/*.pkg
      - build/macos/Build/Products/Release/*.app
      - build/macos/Build/Products/Release/*.dSYM
      - /tmp/xcodebuild_logs/*.log

