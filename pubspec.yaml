name: file_sharing
description: "Local Wi-Fi file transfer between macOS (server) and iOS (client)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  bloc: ^9.0.1
  flutter_bloc: ^9.1.1

  # Navigation
  go_router: ^17.1.0

  # Dependency injection
  get_it: ^9.2.1

  # HTTP client
  dio: ^5.9.0

  # Functional error handling
  dartz: ^0.10.1

  # Code generation annotations
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Bonjour / mDNS discovery (register + browse)
  nsd: ^4.0.0

  # File / folder selection
  file_picker: ^8.3.7

  # Paths
  path_provider: ^2.1.5
  path: ^1.9.0

  # Native share / "Save to Files" sheet
  share_plus: ^10.1.4

  # Local persistence (transfer history)
  hive_ce: ^2.18.0
  hive_ce_flutter: ^2.3.4

  # Spacing helper
  gap: ^3.0.1

  # Shrink-to-fit text
  auto_size_text: ^3.0.0

  # Responsive layout breakpoints
  responsive_framework: ^1.5.1

  # Desktop window control (minimum size)
  window_manager: ^0.4.3
  gpt_markdown: ^1.1.7
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # On-device screenshot capture harness (marketing screenshots).
  integration_test:
    sdk: flutter

  # Fake blocs that emit fixed seeded states for the screenshot harness.
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

  # StreamQueue, used in integration tests.
  async: ^2.11.0

  build_runner: ^2.5.4
  freezed: ^3.2.3
  json_serializable: ^6.9.5
  hive_ce_generator: ^1.11.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
